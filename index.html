<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="与龙佳欢老师的实习面谈讨论页：选择研究话题，记录交流要点，一起确定第一项任务与汇报安排。">
  <title>研究对话 · 实习面谈</title>
  <link rel="icon" href="./assets/discussion-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/discussion.css">
  <script type="module" src="./assets/discussion.js"></script>
</head>
<body>
  <a class="skip-link" href="#discussion">跳到当前话题</a>
  <header class="site-header">
    <a class="brand" href="#direction" aria-label="研究对话首页"><span class="brand-symbol" aria-hidden="true">研<span>谈</span></span><span class="brand-copy">研究对话<small>RESEARCH DIALOGUE</small></span></a>
    <div class="header-actions">
      <button id="large-mode" class="button quiet" type="button" aria-pressed="false"><span aria-hidden="true">Aa</span> <span id="large-label">大字模式</span></button>
      <button id="export-markdown" class="button primary" type="button">导出纪要 <span aria-hidden="true">↗</span></button>
      <details class="more-menu"><summary aria-label="更多记录操作">•••</summary><div class="menu-content">
        <button id="export-json" type="button">备份记录（JSON）</button>
        <button id="import-button" type="button">导入记录</button>
        <button id="print-button" type="button">打印 / 存为 PDF</button>
        <button id="new-session" type="button">新建面谈，保留当前记录</button>
        <label for="session-select">已有面谈</label><select id="session-select"></select>
      </div></details>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <div><p class="eyebrow"><span class="small-dot"></span> 与龙佳欢老师 · 实习面谈</p><h1 id="page-title">一起把问题聊清楚，<br class="mobile-break">把下一步定下来<span class="title-dot">。</span></h1><p class="intro-note">从五个话题中选两三个展开。这里留给问题、不同看法，以及讨论后确定的行动。</p></div>
      <div class="progress-block"><span class="progress-number"><b id="done-count">00</b><span>/ 05</span></span><p>话题已讨论</p><div class="progress-track" aria-hidden="true"><i id="progress-fill"></i></div></div>
    </section>

    <section class="meeting-strip" aria-label="本次面谈信息">
      <label class="meeting-title-label" for="meeting-title"><span>本次记录</span><input id="meeting-title" value="实习面谈" maxlength="60" autocomplete="off" aria-label="本次面谈标题"></label>
      <label class="meeting-date-label" for="meeting-date"><span>日期</span><input id="meeting-date" type="date" aria-label="面谈日期"></label>
      <p class="save-state"><span id="save-dot" aria-hidden="true"></span><span id="save-status" role="status">记录保存在当前浏览器</span></p>
    </section>

    <div class="workspace">
      <aside class="agenda-panel"><div class="agenda-heading"><span>交流路线</span><small>自由选择顺序</small></div><nav id="topic-nav" aria-label="面谈话题"></nav><p class="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> 切换话题<br>输入时不会切换</p></aside>
      <section id="discussion" class="discussion-panel" aria-live="off" tabindex="-1"></section>
      <aside id="notes-panel" class="notes-panel" aria-labelledby="notes-heading"></aside>
    </div>
  </main>

  <footer class="site-footer"><p>论文线索来自导师公开资料；讨论问题与起步任务是交流草案。</p><p>同屏讨论 · 记录仅保存在此浏览器，可导出后分享。<span>本页为个人面谈准备。</span></p></footer>
  <input id="import-file" class="visually-hidden" type="file" accept=".json,application/json" tabindex="-1" aria-label="导入面谈记录 JSON">
  <div id="toast" class="toast" role="status" hidden></div>
  <section id="print-sheet" aria-label="打印纪要"></section>
  <noscript><p class="noscript">请启用 JavaScript 以切换话题和记录纪要。论文入口可见 <a href="https://jiahuan-long.github.io/jiahuan-long-academic/">导师主页</a>。</p></noscript>
</body>
</html>
